name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-build-test:
    name: Java build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: mvn verify (unit + integration)
        run: mvn -B -ntp verify

      - name: Upload WAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: secbret-war
          path: target/secbret.war
          if-no-files-found: error
          retention-days: 7

  python-sidecar:
    name: ML sidecar tests + pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        working-directory: ml-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pip-audit

      - name: Unit tests
        working-directory: ml-sidecar
        run: pytest -q

      - name: pip-audit (dependency CVEs)
        working-directory: ml-sidecar
        run: pip-audit -r requirements.txt --strict

  trivy:
    name: Trivy security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vuln + secret scan (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-files: ".envlocal" 

      - name: Trivy config scan (Dockerfiles + compose)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
